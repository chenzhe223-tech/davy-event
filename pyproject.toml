[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "davy-event"
version = "0.5.0"
description = "Reusable event discovery and normalization core for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DAVYLAB" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.0,<2"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30", "python-multipart>=0.0.9", "httpx>=0.27"]
ocr = ["Pillow>=10", "pytesseract>=0.3.10"]

[project.scripts]
davy-event = "davy_event.cli:main"

[tool.setuptools.packages.find]
include = ["davy_event*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
