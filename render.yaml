services:
  - type: web
    name: davylab-event-radar-docker
    runtime: docker
    plan: free
    region: singapore
    branch: docker-ocr-deploy
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: VOLCENGINE_SEARCH_API_KEY
        sync: false
      - key: DAVY_EVENT_API_TOKEN
        sync: false
