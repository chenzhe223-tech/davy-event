services:
  - type: web
    name: davylab-event-radar
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: python -m pip install --upgrade pip && python -m pip install ".[api]"
    startCommand: uvicorn davy_event.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: VOLCENGINE_SEARCH_API_KEY
        sync: false
      - key: DAVY_EVENT_API_TOKEN
        sync: false
